<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interest Press</title>
<meta name="theme-color" content="#1a1a1a">
<meta name="description" content="Morning newspaper from Boyd's Interest Journal — sports, SpaceX/xAI, bookmarks.">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="paper-texture" aria-hidden="true"></div>
<div id="app">
  <header class="masthead">
    <div class="mast-top">
      <span class="edition" id="editionLabel">Morning Edition</span>
      <span class="vol" id="volLabel">Vol. I</span>
      <span class="price">Local · Offline</span>
    </div>
    <h1 class="nameplate">Interest Press</h1>
    <p class="tagline" id="tagline">Morning edition from Boyd's Interest Journal</p>
    <div class="mast-rule" aria-hidden="true"></div>
    <div class="mast-date" id="mastDate">—</div>
  </header>

  <nav class="section-nav" id="sectionNav" aria-label="Sections">
    <button type="button" data-view="front" class="active">Front Page</button>
    <button type="button" data-view="sports">Sports Desk</button>
    <button type="button" data-view="space">Space &amp; xAI</button>
    <button type="button" data-view="bookmarks">Bookmark Radar</button>
    <button type="button" data-view="archive">Archive</button>
  </nav>

  <main id="main">
    <section id="view-front" class="view active"></section>
    <section id="view-sports" class="view" hidden></section>
    <section id="view-space" class="view" hidden></section>
    <section id="view-bookmarks" class="view" hidden></section>
    <section id="view-archive" class="view" hidden></section>
    <section id="view-reader" class="view" hidden></section>
  </main>

  <footer class="colophon">
    <p>Interest Press · sourced from local Interest Journal files · keyboard: <kbd>←</kbd>/<kbd>→</kbd> articles · <kbd>Esc</kbd> close reader · <kbd>1</kbd>–<kbd>5</kbd> sections</p>
    <p id="footerCounts"></p>
  </footer>
</div>
<script>
window.PRESS = /*__PRESS__*/null;
</script>
<script>/*__APP__*/</script>
</body>
</html>
